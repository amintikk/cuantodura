<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Car longevity comparison tool · Cuánto dura</title>
    <meta name="description" content="Compare up to four car models: overlaid survival curves, median life with confidence interval and reasons for de-registration, based on DGT data." />
    <link rel="canonical" href="https://cuantodura.aminox.dev/en/compare/" />
    <link rel="alternate" hreflang="es" href="https://cuantodura.aminox.dev/comparar/" />
    <link rel="alternate" hreflang="en" href="https://cuantodura.aminox.dev/en/compare/" />
    <link rel="alternate" hreflang="x-default" href="https://cuantodura.aminox.dev/comparar/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Car longevity comparison tool · Cuánto dura" />
    <meta property="og:description" content="Compare up to four car models: overlaid survival curves, median life with confidence interval and reasons for de-registration, based on DGT data." />
    <meta property="og:url" content="https://cuantodura.aminox.dev/en/compare/" />
    <meta property="og:image" content="https://cuantodura.aminox.dev/og/home-en.png" />
    <meta property="og:locale" content="en_GB" />
    <!--#head-->
  </head>
  <body class="page">
    <!--#header-->
    <main id="main">
      <section class="model-hero"><div class="wrap">
        <p class="kicker">Compare</p>
        <h1>Compare up to four models</h1>
        <p class="lead" style="margin-top:14px">Add models using the search box. The page address changes with your selection, so you can share it as it is.</p>
        <div class="picker" id="picker" style="margin-top:24px"></div>
        <div id="cmp-search" style="max-width:460px"></div>
      </div></section>
      <section class="section" style="border-top:0;padding-top:10px"><div class="wrap">
        <figure class="figure"><ul class="legend" id="cmp-legend"></ul><div id="cmp-chart" style="min-height:420px"></div><figcaption>Percentage still registered at each age. Dotted sections are estimated using the segment table, due to a lack of the model's own data.</figcaption></figure>
        <div class="table-scroll" style="margin-top:26px"><table id="cmp-table"></table></div>
        <div class="share-row"><button class="btn small" type="button" data-share><i data-icon="share" data-size="16"></i><span>Share the comparison</span></button></div>
      </div></section>
    </main>
    <!--#footer-->
    <script type="module" src="/src/pages/compare.ts"></script>
  </body>
</html>
