<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0f1218" media="(prefers-color-scheme: dark)" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta property="og:site_name" content="Cuánto dura" />
<meta name="twitter:card" content="summary_large_image" />
<script>
  document.documentElement.classList.add('js');
  setTimeout(function () { window.cdReady || document.documentElement.classList.remove('js'); }, 2500);
  try {
    var th = localStorage.getItem('cuantodura-theme');
    if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th;
  } catch (e) {}
</script>
