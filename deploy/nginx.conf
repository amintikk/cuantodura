server {
    listen 80;
    server_name _;

    # NPM already logs requests in front of this container; keep no second copy here.
    access_log off;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css text/plain application/javascript application/json image/svg+xml application/xml;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;
    gzip_min_length 1024;

    error_page 404 /404.html;

    # nginx drops inherited add_header lines in any location that sets its own, hence the snippet repeated below.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The model template is not a page: send the bare folders to the rankings.
    location = /modelo/ { return 301 /rankings/; }
    location = /en/model/ { return 301 /en/rankings/; }

    # Build output with content hashes in the file names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Data and share images change once a month: revalidate data, cache images for a day.
    location /data/ {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location /og/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ =404;
    }
}
